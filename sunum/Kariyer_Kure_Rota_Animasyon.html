*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0B1A29;overflow:hidden;cursor:pointer}
#s{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:#14293D;font-family:Urbanist,"Segoe UI",system-ui,sans-serif;color:#0F172A;overflow:hidden}
.a{position:absolute}
/* tarayıcı */
.w{position:absolute;left:60px;top:40px;width:1800px;height:1000px;border-radius:18px;background:#fff;overflow:hidden;box-shadow:0 40px 100px rgba(0,0,0,.5)}
.ts{position:absolute;left:0;top:0;width:1800px;height:54px;background:#DEE1E6;display:flex;gap:4px;padding:10px 300px 0 120px}
.dot{position:absolute;top:20px;width:14px;height:14px;border-radius:50%}
.tab{position:relative;flex:0 1 250px;min-width:0;height:44px;border-radius:12px 12px 0 0;background:#CDD1D8;color:#3C4043;font:18px "Segoe UI",system-ui,sans-serif;padding:11px 16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab.on{background:#fff;color:#202124}
.tb{position:absolute;left:0;top:54px;width:1800px;height:62px;background:#fff;border-bottom:1px solid #E3E5E8}
.ad{position:absolute;left:190px;top:11px;width:1400px;height:40px;border-radius:20px;background:#F1F3F4;font:20px "Segoe UI",system-ui,sans-serif;color:#5F6368;padding:7px 22px 0 52px;white-space:nowrap;overflow:hidden}
.ts,.tb,.dot{z-index:2}
.pg{position:absolute;left:0;top:116px;width:1800px;height:884px;background:#fff;overflow:hidden}
.srch{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:#202124}
.sb{position:absolute;border:1px solid #DFE1E5;border-radius:40px;display:flex;align-items:center;gap:20px;padding:0 30px;background:#fff;box-shadow:0 2px 8px rgba(32,33,36,.18)}
.sb i{display:inline-block;width:3px;height:38px;background:#0D9488;animation:bl .8s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.r{position:relative;width:900px;margin-bottom:34px}
.r b{display:block;font-size:22px;font-weight:400}
.r b u{display:inline-block;width:26px;height:26px;border-radius:50%;vertical-align:-7px;margin-right:12px}
.r strong{display:block;font-size:30px;font-weight:400;color:#1A0DAB;margin-top:4px}
.r em{display:block;font-style:normal;font-size:22px;color:#4D5156;margin-top:4px}
.r span,.c span{display:inline-block;font-size:18px;font-weight:700;padding:3px 10px;border-radius:12px;margin-left:10px;vertical-align:4px;color:#202124}
.ch{position:relative;display:inline-block;margin:0 12px 14px 0;padding:12px 22px;border-radius:24px;background:#F1F3F4;font-size:22px;color:#3C4043}
.c{position:absolute;width:430px;padding:20px 24px;border-radius:14px;background:#fff;color:#1A0DAB;font:25px "Segoe UI",system-ui,sans-serif;box-shadow:0 14px 40px rgba(0,0,0,.35)}
.c b{display:block;font-size:18px;font-weight:400;color:#4D5156;margin-bottom:4px}
.q{position:absolute;padding:10px 22px;border-radius:30px;background:#B08854;color:#14293D;font-weight:800;font-size:30px;white-space:nowrap;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.pill{position:absolute;right:20px;top:9px;height:38px;padding:5px 16px;border-radius:19px;background:#D93025;color:#fff;font-weight:800;font-size:21px}
.big{position:absolute;left:0;width:1920px;text-align:center;font-weight:800;color:#F8FAFC}
/* site */
.brand{display:flex;align-items:center;gap:14px}
.brand img{height:30px}
.brand b{display:block;font-size:30px;font-weight:500;color:#0F172A;letter-spacing:-.5px;line-height:1}
.brand b span{font-weight:800}
.brand small{display:block;font-size:12px;letter-spacing:3.5px;color:#64748B;font-weight:700;margin-top:4px}
.pk{display:inline-flex;align-items:center;gap:10px;font-size:18px;color:#0F766E;background:#E6F4F1;border-radius:20px;padding:8px 18px;font-weight:700}
.pk:before{content:"";width:9px;height:9px;border-radius:50%;background:#0D9488}
.eyb{font-size:16px;font-weight:800;letter-spacing:2.5px;color:#0F766E;text-transform:uppercase}
.muted{color:#64748B}
.btn{display:inline-flex;align-items:center;gap:12px;background:#0D9488;color:#fff;font-weight:800;font-size:22px;padding:16px 30px;border-radius:14px;box-shadow:0 10px 24px rgba(13,148,136,.25)}
.opt{display:flex;align-items:center;gap:16px;border:1.5px solid #E2E8F0;background:#fff;border-radius:16px;padding:16px 20px;font-size:22px;font-weight:700;color:#0F172A;transition:all .25s}
.opt small{display:block;font-size:17px;font-weight:500;color:#64748B;margin-top:2px}
.opt .ck{margin-left:auto;flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid #CBD5E1;display:grid;place-items:center;transition:all .25s}
.opt.sel{border-color:#0D9488;background:#F0FAF8;box-shadow:0 0 0 5px rgba(13,148,136,.13)}
.opt.sel .ck{background:#0D9488;border-color:#0D9488}
.ico{flex:none;width:46px;height:46px;border-radius:12px;background:#F1F5F9;display:grid;place-items:center;color:#0F766E}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.gb{display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 0;border:1.5px solid #E2E8F0;border-radius:18px;background:#fff;color:#0F766E;transition:all .25s}
.gb strong{font-size:34px;color:#0F172A}
.gb small{font-size:16px;color:#64748B}
.gb.sel{border-color:#0D9488;background:#F0FAF8;box-shadow:0 0 0 5px rgba(13,148,136,.13)}
.lbl{font-size:20px;font-weight:700;color:#0F172A;margin:22px 0 10px}
.inp{border:1.5px solid #E2E8F0;border-radius:14px;padding:16px 20px;font-size:22px;background:#fff;height:60px}
.seg{display:flex;background:#F1F5F9;border-radius:14px;padding:5px}
.seg span{flex:1;text-align:center;padding:12px;font-size:20px;color:#64748B;border-radius:10px;transition:all .25s}
.seg span.on{background:#fff;color:#0F766E;font-weight:800;box-shadow:0 2px 8px rgba(15,23,42,.08)}
.chip{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1.5px solid #99D5CC;color:#0F766E;font-weight:800;font-size:20px;padding:10px 16px;border-radius:999px;box-shadow:0 6px 16px rgba(13,148,136,.12)}
.nv{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:14px;font-size:21px;color:#334155;margin-bottom:6px;position:relative}
.nv.on{background:#E6F4F1;color:#0F766E;font-weight:800}
.card{position:absolute;width:440px;background:#fff;border:1px solid #E2E8F0;border-radius:22px;padding:24px 26px}
.lg{width:60px;height:60px;border-radius:14px;border:1px solid #E2E8F0;display:grid;place-items:center;background:#fff;overflow:hidden}
.lg img{width:40px}
.kind{font-size:15px;font-weight:800;letter-spacing:2px;color:#64748B;margin-top:16px}
.st{font-size:19px;font-weight:700;color:#0F766E;margin-top:6px}
.ct{font-size:26px;font-weight:800;color:#0F172A;margin-top:8px;line-height:1.2}
.cd{font-size:18px;color:#64748B;line-height:1.45;margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;gap:22px;font-size:17px;color:#475569;margin-top:14px}
.why{margin-top:14px;background:#F1F7F6;border-radius:14px;padding:14px 16px;font-size:18px;color:#475569;line-height:1.4;position:relative}
.why b{color:#0F172A}
.cf{display:flex;justify-content:space-between;margin-top:14px;padding-top:14px;border-top:1px solid #EEF2F6;font-size:17px;color:#64748B}
.cf b{color:#0F766E}
.toast{position:absolute;width:560px;background:#ECFDF5;border:1px solid #A7F3D0;border-radius:16px;padding:20px 24px;color:#047857;font-size:20px;line-height:1.4;box-shadow:0 20px 40px rgba(15,23,42,.18);display:flex;gap:14px}
.toast b{display:block;color:#065F46}
.cal{position:absolute;background:#fff;border:1px solid #E2E8F0;border-radius:22px;overflow:hidden}
.cell{position:absolute;border-right:1px solid #EEF2F6;border-bottom:1px solid #EEF2F6;font-size:17px;color:#334155;padding:8px 10px}
.cell.o{color:#CBD5E1}
.ev{position:absolute;left:6px;right:6px;bottom:8px;height:30px;border-radius:8px;background:#E6F4F1;display:flex;align-items:center;gap:6px;padding:0 6px;font-size:14px;color:#0F766E;font-weight:700;white-space:nowrap;overflow:hidden}
.ev img{width:18px;height:18px;border-radius:4px;background:#fff}
.ev.dl{background:#F6EEE3;color:#8A6A3E}
.pnl{position:absolute;background:#fff;border:1px solid #E2E8F0;border-radius:22px;padding:26px 28px}
.up{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid #EEF2F6;font-size:18px;color:#334155}
.up img{width:34px;height:34px;border-radius:9px;border:1px solid #E2E8F0;padding:4px;background:#fff}
.up b{display:block;color:#0F172A;font-size:19px}

.mc{position:absolute;width:160px;height:108px;border-radius:12px;background:#1E3A55;border:1px solid #2B4A66;padding:10px 12px;color:#E2E8F0;font-size:16px;font-weight:700;line-height:1.2;overflow:hidden}

.mc .bar{position:absolute;left:12px;bottom:12px;height:8px;border-radius:4px;background:#5EEAD4;width:0}

.rule.on{background:#0F3B44;color:#99F6E4;box-shadow:0 0 0 2px #0D9488}

.trk .it{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:700;color:#7C93A8;transition:color .4s}
.trk .nm{width:32px;height:32px;border-radius:50%;border:2px solid #34526E;display:grid;place-items:center;font-size:15px;font-weight:800;color:#7C93A8;transition:all .4s}

.trk .it.on{color:#F8FAFC}

.trk .cn.dn{background:#0D9488}

.cap b{color:#5EEAD4;font-weight:800}
.sec{position:absolute;left:204px;top:36px;font-size:18px;font-weight:800;letter-spacing:4px;color:#5EEAD4}

.stp .s.on{color:#0F172A}.stp .s.on i{border-color:#0D9488;box-shadow:0 0 0 5px rgba(13,148,136,.18)}

.av{display:flex;flex-direction:column;align-items:center;gap:6px;width:130px;text-align:center;font-size:15px;color:#64748B;font-weight:600}
.av span{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:22px;font-weight:800;color:#fff}

.rolec{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;border:1.5px solid #E2E8F0;font-size:18px;font-weight:700;color:#475569;background:#fff;transition:all .3s}
.rolec.on{border-color:#0D9488;background:#E6F4F1;color:#0F766E;box-shadow:0 0 0 4px rgba(13,148,136,.14)}
